# ─────────────────────────────────────────────────────────────────────────────
# Sales Engine API — Production Deploy Workflow
#
# Triggers:
#   push to `main`     → test + build + deploy
#   workflow_dispatch  → same
#
# Required GitHub Secret:
#   DO_ACCESS_TOKEN   DigitalOcean personal access token (same as Factory23)
#
# Prerequisites (one-time, see docs/DEPLOYMENT.md):
#   - Namespace sales-engine
#   - Secret sales-engine-secret (APP_KEY, DB_PASSWORD)
#   - ImagePullSecret do-registry in sales-engine namespace
#   - MySQL database sales_engine + user on managed DO MySQL
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/con-reg
  IMAGE_NAME: registry.digitalocean.com/con-reg/sales-engine-api
  DOKS_CLUSTER_ID: 8236d5b0-a49e-4ed8-9310-b432b7e3e2d2
  K8S_NAMESPACE: sales-engine

jobs:
  # ── Job 1: Lint & Test ────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: sales_engine_test
          MYSQL_USER: sales_engine_test
          MYSQL_PASSWORD: sales_engine_test_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest_root_pass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, pcntl, exif
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: |
          for attempt in 1 2 3; do
            composer install --optimize-autoloader --prefer-dist --no-interaction && exit 0
            echo "composer install attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Configure test environment
        run: |
          php artisan key:generate
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=sales_engine_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=sales_engine_test/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=sales_engine_test_pass/' .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Seed signal type definitions (Stage 2 registry)
        run: php artisan db:seed --class=SignalTypeDefinitionSeeder --force --no-interaction

      - name: Run PHP syntax check
        run: find app config routes -name "*.php" -print0 | xargs -0 php -l | grep -v "No syntax errors" || true

      - name: Run test suite
        run: php artisan test

      - name: Health route smoke (artisan)
        run: |
          php artisan route:list --path=api/v1/health | grep -q health

  # ── Job 2: Build & Push image ─────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"}}

  # ── Job 3: Deploy to Production ───────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://api.salesengine.thefactory23.com/api/v1/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ env.DOKS_CLUSTER_ID }}

      - name: Ensure namespace and registry pull secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          # Ensure image pull secret named do-registry (matches Deployment manifests).
          doctl auth init --access-token "${{ secrets.DO_ACCESS_TOKEN }}" >/dev/null
          doctl registry login --expiry-seconds 900
          kubectl create secret docker-registry do-registry \
            -n ${{ env.K8S_NAMESPACE }} \
            --docker-server=registry.digitalocean.com \
            --docker-username="$(doctl account get --format Email --no-header)" \
            --docker-password="${{ secrets.DO_ACCESS_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tag variable
        id: tag
        run: echo "SHA_TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Pin image tag in manifests
        run: |
          NEW_IMAGE="${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.SHA_TAG }}"
          echo "Deploying image: $NEW_IMAGE"
          sed -i "s|${{ env.IMAGE_NAME }}:[^ ]*|$NEW_IMAGE|g" \
            k8s/backend-deployment.yaml \
            k8s/migrate-job.yaml \
            k8s/queue-worker-deployment.yaml \
            k8s/discovery-queue-worker-deployment.yaml \
            k8s/scheduler-deployment.yaml

      - name: Apply ConfigMap, Redis, Nginx, Certificate, Ingress
        run: |
          kubectl apply -f k8s/configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/nginx-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/redis-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/redis-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/redis-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/backend-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/certificate.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/ingress.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for Redis
        run: |
          kubectl rollout status deployment/redis \
            -n ${{ env.K8S_NAMESPACE }} --timeout=180s || true

      - name: Guard — secrets must exist
        run: |
          if ! kubectl get secret sales-engine-secret -n ${{ env.K8S_NAMESPACE }} >/dev/null 2>&1; then
            echo "Missing secret/sales-engine-secret in namespace ${{ env.K8S_NAMESPACE }}."
            echo "Create it from k8s/secret.example.yaml (see docs/DEPLOYMENT.md) before deploying."
            exit 1
          fi

      - name: Run database migrations and Stage 2 signal registry seed
        run: |
          kubectl delete job laravel-migrate -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f k8s/migrate-job.yaml -n ${{ env.K8S_NAMESPACE }}

          if ! kubectl wait --for=condition=complete job/laravel-migrate \
            -n ${{ env.K8S_NAMESPACE }} --timeout=600s; then
            echo "=== Migration/seed job failed or timed out ==="
            kubectl describe job/laravel-migrate -n ${{ env.K8S_NAMESPACE }} || true
            kubectl logs -n ${{ env.K8S_NAMESPACE }} -l app=laravel-migrate --all-containers=true --tail=200 || true
            exit 1
          fi
          echo "Migrations + SignalTypeDefinitionSeeder complete"

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl patch deployment/backend -n ${{ env.K8S_NAMESPACE }} --type=strategic \
            -p '{"spec":{"strategy":{"rollingUpdate":{"maxUnavailable":1,"maxSurge":0}}}}' || true

      - name: Wait for rollout
        run: |
          if ! kubectl rollout status deployment/backend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=600s; then
            echo "=== Backend rollout timed out ==="
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=backend -o wide || true
            kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=backend || true
            for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=backend \
              -o jsonpath='{.items[*].metadata.name}'); do
              echo "--- logs: $pod (init-app) ---"
              kubectl logs -n ${{ env.K8S_NAMESPACE }} "$pod" -c init-app --tail=80 || true
              echo "--- logs: $pod (nginx) ---"
              kubectl logs -n ${{ env.K8S_NAMESPACE }} "$pod" -c nginx --tail=80 || true
            done
            exit 1
          fi

      - name: Deploy queue worker, discovery worker, and scheduler
        run: |
          kubectl apply -f k8s/queue-worker-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/discovery-queue-worker-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/scheduler-deployment.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for worker and scheduler rollout
        run: |
          kubectl rollout status deployment/queue-worker \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/discovery-queue-worker \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/scheduler \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Smoke test — health endpoint
        run: |
          kubectl wait --for=condition=available deployment/backend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=150s

          HEALTH=$(kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/backend -c nginx -- \
            wget -qO- http://127.0.0.1/api/v1/health 2>/dev/null || echo "FAIL")
          echo "Health response: $HEALTH"
          if ! echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "SMOKE TEST FAILED — rolling back"
            kubectl rollout undo deployment/backend -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi
          if ! echo "$HEALTH" | grep -q '"service":"sales-engine"'; then
            echo "SMOKE TEST FAILED — unexpected service field"
            kubectl rollout undo deployment/backend -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi
          echo "SMOKE TEST PASSED"

      - name: Print deployment summary
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Ingress / Certificate ==="
          kubectl get ingress,certificate -n ${{ env.K8S_NAMESPACE }} || true
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -15 || true
