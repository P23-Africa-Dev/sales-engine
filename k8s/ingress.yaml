# ─────────────────────────────────────────────────────────────────────────────
# Ingress — api.salesengine.thefactory23.com
# Prerequisites: ingress-nginx, cert-manager Certificate applied.
# DNS A record: api.salesengine.thefactory23.com → 157.245.28.86
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-engine-ingress
  namespace: sales-engine
  labels:
    app.kubernetes.io/name: sales-engine
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.salesengine.thefactory23.com
      secretName: api-salesengine-thefactory23-com-tls
  rules:
    - host: api.salesengine.thefactory23.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
