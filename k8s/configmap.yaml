apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-engine-config
  namespace: sales-engine
  labels:
    app.kubernetes.io/name: sales-engine
    app.kubernetes.io/component: config
data:
  # ── Application ─────────────────────────────────────────────────────────────
  APP_NAME: "SalesEngine"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://api.salesengine.thefactory23.com"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  APP_MAINTENANCE_DRIVER: "file"

  # ── Logging ──────────────────────────────────────────────────────────────────
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"

  # ── Database (non-sensitive) ──────────────────────────────────────────────────
  # Same DigitalOcean Managed MySQL host as Factory23; separate database name.
  DB_CONNECTION: "mysql"
  DB_HOST: "db-mysql-lon1-fac23-do-user-25707955-0.e.db.ondigitalocean.com"
  DB_PORT: "25060"
  DB_DATABASE: "sales_engine"
  DB_USERNAME: "sales_engine_user"

  # ── Cache / Queue / Session ───────────────────────────────────────────────────
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_SECURE_COOKIE: "true"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"

  # Redis must not release reserved jobs before ProcessChatIntentJob can finish
  # (job timeout 300s, discovery hard deadline ~150s). Default 90s caused
  # MaxAttemptsExceeded races and false "timed out" chat messages.
  REDIS_QUEUE_RETRY_AFTER: "360"

  # ── Redis (non-sensitive) ─────────────────────────────────────────────────────
  REDIS_CLIENT: "predis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # ── Frontend / CORS (fill as frontends go live) ───────────────────────────────
  FRONTEND_URL: "https://salesengine.thefactory23.com"
  CORS_ALLOWED_ORIGINS: "https://thefactory23.com,https://www.thefactory23.com,https://salesengine.thefactory23.com,http://localhost:3000,http://127.0.0.1:3000"
  SANCTUM_STATEFUL_DOMAINS: "api.salesengine.thefactory23.com,salesengine.thefactory23.com,thefactory23.com,localhost"

  # Stage 1 ICP hard filter default for new SocialListeningSetting rows (ops kill switch).
  SOCIAL_LISTENING_ICP_FILTER_ENABLED_DEFAULT: "true"

  # Explicit view compiled path avoids realpath() returning false on fresh containers
  VIEW_COMPILED_PATH: "/var/www/html/storage/framework/views"

  # ── Factory23 + LLM / discovery (non-secret) ────────────────────────────────
  FACTORY23_API_URL: "https://api.thefactory23.com"
  FACTORY23_CRM_SYNC_ENABLED: "true"
  GLM_BASE_URL: "https://open.bigmodel.cn/api/paas/v4"
  GLM_CHAT_MODEL: "glm-4-flash"
  GLM_EXTRACT_MODEL: "glm-4-flash"
  GLM_SCORE_MODEL: "glm-4-air"
  GLM_OUTREACH_MODEL: "glm-4-flash"
  SERPER_BASE_URL: "https://google.serper.dev"
  SERPER_MAX_RESULTS: "20"
  MONO_BASE_URL: "https://api.withmono.com"
  FYLINGS_BASE_URL: "https://api.fylings.com"

  # ── SendGrid (email outreach) ──────────────────────────────────────────────────
  SENDGRID_PLATFORM_FROM_EMAIL: "outreach@thefactory23.org"
  SENDGRID_PLATFORM_FROM_NAME: "Sales Engine"
  # Filled by `php artisan outreach:setup-sendgrid <webhook-url>` during rollout.
  SENDGRID_UNSUBSCRIBE_GROUP_ID: "53250"
