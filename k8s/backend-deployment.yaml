# ─────────────────────────────────────────────────────────────────────────────
# Backend Deployment — PHP-FPM + Nginx (sidecar)
# Image: registry.digitalocean.com/con-reg/sales-engine-api:<tag>
# Health: GET /api/v1/health
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sales-engine
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sales-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: do-registry

      initContainers:
        - name: init-app
          image: registry.digitalocean.com/con-reg/sales-engine-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[init-app] Ensuring required storage directories..."
              mkdir -p /var/www/html/storage/framework/views \
                       /var/www/html/storage/framework/sessions \
                       /var/www/html/storage/framework/cache/data \
                       /var/www/html/storage/logs \
                       /var/www/html/storage/app/public

              echo "[init-app] Regenerating Laravel caches with production env..."
              php artisan config:clear
              php artisan config:cache
              php artisan route:cache
              php artisan event:cache
              php artisan view:cache 2>/dev/null || echo "[init-app] view:cache skipped"

              php artisan storage:link --force 2>/dev/null || true

              echo "[init-app] Copying public/ for nginx..."
              cp -r /var/www/html/public/. /srv/public/
              chmod -R 755 /srv/public

              echo "[init-app] Copying storage/ for php-fpm..."
              cp -rp /var/www/html/storage/. /srv/storage/
              mkdir -p /srv/storage/framework/views \
                       /srv/storage/framework/sessions \
                       /srv/storage/framework/cache/data \
                       /srv/storage/logs \
                       /srv/storage/app/public
              chown -R 33:33 /srv/storage
              chmod -R 775 /srv/storage

              echo "[init-app] Copying bootstrap/cache/..."
              cp -rp /var/www/html/bootstrap/cache/. /srv/bootstrap-cache/
              chown -R 33:33 /srv/bootstrap-cache
              chmod -R 775 /srv/bootstrap-cache

              echo "[init-app] Done."
          securityContext:
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: sales-engine-config
            - secretRef:
                name: sales-engine-secret
          volumeMounts:
            - name: public-files
              mountPath: /srv/public
            - name: laravel-storage
              mountPath: /srv/storage
            - name: laravel-boot-cache
              mountPath: /srv/bootstrap-cache

      containers:
        - name: php-fpm
          image: registry.digitalocean.com/con-reg/sales-engine-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sales-engine-config
            - secretRef:
                name: sales-engine-secret
          resources:
            requests:
              cpu: "40m"
              memory: "64Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/html/storage
            - name: laravel-boot-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: php-custom-ini
              mountPath: /usr/local/etc/php/conf.d/99-custom.ini
              subPath: 99-custom.ini
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false

        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: public-files
              mountPath: /var/www/html/public
              readOnly: true
            - name: laravel-storage
              mountPath: /var/www/html/storage
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 80
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 80
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        - name: public-files
          emptyDir: {}
        - name: laravel-storage
          emptyDir: {}
        - name: laravel-boot-cache
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: php-custom-ini
          configMap:
            name: php-custom-ini
