# ─────────────────────────────────────────────────────────────────────────────
# secret.example.yaml  —  TEMPLATE ONLY. Never apply this file directly.
#
# Usage:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # Edit k8s/secret.yaml and fill in all real values
#   kubectl apply -f k8s/secret.yaml
#
# Rules:
#   1. NEVER commit k8s/secret.yaml to version control.
#   2. k8s/secret.yaml is listed in .gitignore.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: sales-engine-secret
  namespace: sales-engine
type: Opaque
stringData:
  # Generate with: php artisan key:generate --show
  APP_KEY: "base64:REPLACE_WITH_32_BYTE_BASE64_KEY"

  # DigitalOcean Managed MySQL password for sales_engine_user
  DB_PASSWORD: "strong-password-16-chars-minimum"

  # Leave empty string "" if no Redis AUTH (default for in-cluster redis)
  REDIS_PASSWORD: ""

  # ── Integration secrets (see docs/ENV_SETUP.md) ─────────────────────────────
  GLM_API_KEY: "REPLACE"
  SERPER_API_KEY: "REPLACE"
  FACTORY23_JWT_SECRET: "REPLACE_SHARED_WITH_FACTORY23"
  # MUST match Factory23 SALES_ENGINE_INTERNAL_TOKEN
  FACTORY23_INTERNAL_TOKEN: "REPLACE_SHARED_WITH_FACTORY23_INTERNAL"
  FACTORY23_API_TOKEN: ""
  MONO_SECRET_KEY: ""
  FYLINGS_API_KEY: ""
  APOLLO_API_KEY: ""
  HUNTER_API_KEY: ""
  BYTEMINE_API_KEY: ""
  CLEANLIST_API_KEY: ""
  YOUTUBE_API_KEY: ""
  X_BEARER_TOKEN: ""
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  META_ACCESS_TOKEN: ""
  META_APP_ID: ""
  META_APP_SECRET: ""
  SENDGRID_API_KEY: ""
  SENDGRID_WEBHOOK_SECRET: ""
  # Fill after running: php artisan outreach:setup-sendgrid <webhook-url>
  SENDGRID_WEBHOOK_PUBLIC_KEY: ""
